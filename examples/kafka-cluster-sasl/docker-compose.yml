      KAFKA_SSL_KEYSTORE_FILENAME: ssl/kafka.kafka-sasl-lo.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: ssl/kafka-sasl-lo_keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: ssl/kafka-sasl-lo_sslkey_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: ssl/kafka.kafka-sasl-lo.truststore.jks
