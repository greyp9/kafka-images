      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 42181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: kafka-sasl-lo:22888:23888;kafka-sasl-lo:32888:33888;kafka-sasl-lo:42888:43888
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/zookeeper_3_jaas.conf
        -Djava.security.krb5.conf=/etc/kafka/secrets/krb.external.conf
        -Dzookeeper.authProvider.1=org.apache.zookeeper.server.auth.SASLAuthenticationProvider
        -Dsun.security.krb5.debug=true
    volumes:
    - ${KAFKA_SASL_SECRETS_DIR}:/etc/kafka/secrets
    network_mode: host
#    ports:
#      - '42181:42181'
#      - '43888:43888'
    extra_hosts:
      - "moby:127.0.0.1"

#  kerberos:
#    image: confluentinc/cp-kerberos:latest
#    network_mode: host
#    environment:
#      BOOTSTRAP: 0
#    volumes:
#      - ${KAFKA_SASL_SECRETS_DIR}:/tmp/keytab
#      - /dev/urandom:/dev/random
#    extra_hosts:
#      - "moby:127.0.0.1"

  kafka-sasl-1:
    image: confluentinc/cp-kafka:latest
    network_mode: host
#    ports:
#      - '19094:19094'
    # This is required because Kafka can fail if kerberos is still initializing.
    restart: on-failure:3
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: kafka-sasl-lo:22181,kafka-sasl-lo:32181,kafka-sasl-lo:42181
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka-sasl-lo:19094
      KAFKA_SSL_KEYSTORE_FILENAME: ssl/kafka.kafka-sasl-lo.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: ssl/kafka-sasl-lo_keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: ssl/kafka-sasl-lo_sslkey_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: ssl/kafka.kafka-sasl-lo.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: ssl/kafka-sasl-lo_truststore_creds
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SECURITY_INTER_BROKER_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: GSSAPI
      KAFKA_SASL_ENABLED_MECHANISMS: GSSAPI
      KAFKA_SASL_KERBEROS_SERVICE_NAME: kafka
      KAFKA_LOG4J_ROOT_LOGLEVEL: DEBUG
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/broker1_jaas.conf
        -Djava.security.krb5.conf=/etc/kafka/secrets/krb.conf
        -Dsun.security.krb5.debug=true
    volumes:
      - ${KAFKA_SASL_SECRETS_DIR}:/etc/kafka/secrets
    extra_hosts:
      - "moby:127.0.0.1"

  kafka-sasl-2:
    image: confluentinc/cp-kafka:latest
    network_mode: host
#    ports:
#      - '29094:29094'
    restart: on-failure:3
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: kafka-sasl-lo:22181,kafka-sasl-lo:32181,kafka-sasl-lo:42181
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka-sasl-lo:29094
      KAFKA_SSL_KEYSTORE_FILENAME: ssl/kafka.kafka-sasl-lo.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: ssl/kafka-sasl-lo_keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: ssl/kafka-sasl-lo_sslkey_creds
